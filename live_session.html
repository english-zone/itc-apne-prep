/* Canvas & Drawing Tools */
.drawing-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: 9998;
  cursor: crosshair;
  display: none;
}
.drawing-toolbar {
  position: fixed;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: rgba(0,0,0,0.85);
  border-radius: 50px;
  padding: 0.5rem 1.2rem;
  display: none;
  align-items: center;
  gap: 0.8rem;
  backdrop-filter: blur(10px);
}
.drawing-toolbar.active, .drawing-canvas.active { display: flex; }
.drawing-toolbar button, .drawing-toolbar input {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  border-radius: 20px;
  padding: 0.4rem 0.8rem;
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 0.85rem;
}
.drawing-toolbar button:hover { background: rgba(255,255,255,0.2); }
.drawing-toolbar input[type="color"] { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid #fff; }
.toggle-draw-btn {
  position: fixed; top: 20px; left: 20px; z-index: 10000;
  background: var(--accent); color: white;
  border: none; padding: 10px 20px;
  border-radius: 50px; font-family: 'Cairo', sans-serif;
  font-size: 1rem; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 14px rgba(0,113,227,0.4);
  transition: opacity 0.2s;
  display: flex; align-items: center; gap: 0.4rem;
}
.toggle-draw-btn:hover { opacity: 0.88; }
</style>
</head>
<body>
<button class="toggle-draw-btn" id="toggleDrawBtn" onclick="toggleDrawing()">🖊️ وضع الرسم</button>
<canvas id="drawCanvas" class="drawing-canvas"></canvas>
<div class="drawing-toolbar" id="drawToolbar">
  <input type="color" id="penColor" value="#ff0000">
  <input type="range" id="penSize" min="1" max="10" value="3">
  <button onclick="clearCanvas()">🗑️ مسح الكل</button>
</div>

<script>
// ... [نفس سكريبت الكشف عن الإجابات السابق] ...

// --- Drawing Logic ---
(function() {
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let color = '#ff0000';
  let size = 3;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  document.getElementById('penColor').addEventListener('change', (e) => color = e.target.value);
  document.getElementById('penSize').addEventListener('change', (e) => size = e.target.value);

  canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); });
  canvas.addEventListener('mousemove', (e) => {
    if (!drawing) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineTo(e.clientX, e.clientY);
    ctx.stroke();
  });
  window.addEventListener('mouseup', () => drawing = false);

  // Touch support
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); drawing = true;
    const touch = e.touches[0];
    ctx.beginPath(); ctx.moveTo(touch.clientX, touch.clientY);
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!drawing) return;
    const touch = e.touches[0];
    ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round';
    ctx.lineTo(touch.clientX, touch.clientY);
    ctx.stroke();
  });
  window.addEventListener('touchend', () => drawing = false);
})();

function toggleDrawing() {
  const canvas = document.getElementById('drawCanvas');
  const toolbar = document.getElementById('drawToolbar');
  const btn = document.getElementById('toggleDrawBtn');
  const isActive = canvas.classList.contains('active');
  if (isActive) {
    canvas.classList.remove('active');
    toolbar.classList.remove('active');
    btn.innerHTML = '🖊️ وضع الرسم';
    btn.style.background = 'var(--accent)';
  } else {
    canvas.classList.add('active');
    toolbar.classList.add('active');
    btn.innerHTML = '✋ إيقاف الرسم';
    btn.style.background = '#dc2626';
  }
}

function clearCanvas() {
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
