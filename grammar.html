<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جميع القواعد - APNE</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grammar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin: 1.5rem 0; }
        .grammar-card { background: white; border-radius: 20px; padding: 1.3rem; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .grammar-card h3 { margin-top: 0; color: #1d1d1f; }
        .grammar-card p { color: #86868b; font-size: 0.9rem; }
        .grammar-card a { display: inline-block; background: #0071e3; color: white; padding: 0.5rem 1.2rem; border-radius: 20px; text-decoration: none; font-weight: 500; margin-top: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📘 جميع قواعد اللغة الإنجليزية</h1>
        <p style="color:#86868b;">اختر الدرس الذي تريد مراجعته من القائمة أدناه.</p>
        <div class="grammar-grid" id="grammarGrid">جاري التحميل…</div>
    </div>
    <script>
        const topics = [
            { day:1, title:"Present & Past Simple + Articles + Pronouns", desc:"الأزمنة البسيطة، أدوات التعريف، الضمائر" },
            { day:2, title:"Continuous Tenses + Question Tags + The", desc:"الأزمنة المستمرة، الأسئلة الذيلية، أداة التعريف" },
            { day:3, title:"Perfect Tenses + For/Since + Prepositions", desc:"الأزمنة التامة، حروف الجر، الفرق بين for وsince" },
            { day:4, title:"Passive Voice + Modal Verbs", desc:"المبني للمجهول في جميع الأزمنة، الأفعال الناقصة" },
            { day:5, title:"Comparative & Superlative + as…as", desc:"المقارنة والتفضيل، الشواذ، المساواة" },
            { day:6, title:"Gerund vs Infinitive + Used to", desc:"المصدر مع ing أو to، العادات الماضية" },
            { day:7, title:"Final Grammar Review", desc:"مراجعة شاملة لجميع القواعد" }
        ];
        let html = '';
        topics.forEach(t => {
            html += `<div class="grammar-card">
                <h3>${t.title}</h3>
                <p>${t.desc}</p>
                <a href="grammar-lesson.html?day=${t.day}">فتح الدرس</a>
            </div>`;
        });
        document.getElementById('grammarGrid').innerHTML = html;
    </script>
</body>
</html>
