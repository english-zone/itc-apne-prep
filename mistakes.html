<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mistakes</title><link rel="stylesheet" href="css/style.css"></head><body><div class="container"><h2>⚠️ الأخطاء السابقة</h2><div id="mistakesList">لا توجد أخطاء محفوظة.</div></div><script>let mistakes=JSON.parse(localStorage.getItem('apne_mistakes')||'[]');if(mistakes.length){let h='<ul>';mistakes.forEach(m=>h+='<li>'+m.question+' → الصحيح: '+m.correct+'</li>');h+='</ul>';document.getElementById('mistakesList').innerHTML=h}else{document.getElementById('mistakesList').innerHTML='<p>لا توجد أخطاء بعد.</p>'}</script></body></html>
