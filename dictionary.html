<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dictionary</title><link rel="stylesheet" href="css/style.css"><style>.word-card{background:#f5f5f7;border-radius:16px;padding:1rem;margin:.5rem;display:flex;justify-content:space-between}.en{font-weight:700}.ar{color:#0071e3}.page{color:#86868b;font-size:.8rem}</style></head><body><div class="container"><h1>📖 قاموس APNE</h1><div id="list">جاري التحميل...</div></div><script>const topics=['day-01','day-02','day-03','day-04','day-05','day-06','day-07'];let allWords=[];Promise.all(topics.map(t=>fetch('content/'+t+'/vocabulary.json').then(r=>r.json()).catch(()=>{}))).then(data=>{data.forEach(d=>{if(d&&d.words)allWords=allWords.concat(d.words)});let h='';allWords.forEach(w=>h+='<div class="word-card"><span class="en">'+w.english+'</span><span class="ar">'+w.arabic+'</span><span class="page">ص '+w.page+'</span></div>');document.getElementById('list').innerHTML=h||'لا توجد كلمات.'});</script></body></html>
