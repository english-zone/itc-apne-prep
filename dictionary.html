<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary – ITC APNE Prep</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="navbar" id="navbar"></nav>
    <div class="theme-toggle"><button id="themeToggle" aria-label="Toggle dark/light mode">🌓</button></div>
  </header>
  <main class="container">
    <h1>📚 Dictionary</h1>
    <div class="search-bar">
      <input type="text" id="dictSearch" placeholder="Search word (EN → EN + AR)...">
    </div>
    <div class="alphabet-filter" id="alphabetFilter"></div>
    <div id="dictionaryList">
      <div class="empty-state"><p>Loading dictionary...</p></div>
    </div>
    <div id="dictDetailPopup" class="popup-overlay" style="display:none;">
      <div class="popup-card">
        <button class="popup-close" onclick="document.getElementById('dictDetailPopup').style.display='none'">&times;</button>
        <div id="dictDetailContent"></div>
      </div>
    </div>
  </main>
  <footer class="app-footer"><p>Dictionary loaded from /content/dictionary/dictionary.json</p></footer>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dictionary.js"></script>
</body>
</html>
