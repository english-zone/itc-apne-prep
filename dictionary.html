<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القاموس الشامل - APNE Prep</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dictionary-container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .topic-section {
            margin-bottom: 40px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }
        .topic-title {
            background: #0077cc;
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .word-card {
            display: inline-block;
            width: 250px;
            margin: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            vertical-align: top;
        }
        .word {
            font-weight: bold;
            color: #0077cc;
            font-size: 1.2rem;
        }
        .definition {
            font-size: 0.9rem;
            color: #333;
        }
        .example {
            font-size: 0.8rem;
            color: #666;
            font-style: italic;
        }
        @media (max-width: 800px) {
            .word-card { width: 90%; margin: 5px auto; display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 القاموس الشامل للمفردات</h1>
        <div class="dictionary-container" id="dictionary-container">
            <div id="loading">جاري تحميل القاموس...</div>
        </div>
    </div>
    <script>
        const topics = [
            { name: "Family & Body Parts", file: "family-body" },
            { name: "Clothing & Weather", file: "clothing-weather" },
            { name: "Health & Medicine", file: "health-medicine" },
            { name: "Food & Drink", file: "food-drink" },
            { name: "Jobs & Work", file: "jobs-work" },
            { name: "Shopping & Materials", file: "shopping-materials" }
        ];
        
        async function loadDictionary() {
            const container = document.getElementById("dictionary-container");
            container.innerHTML = "";
            for (let topic of topics) {
                try {
                    const response = await fetch(`content/vocabulary/topics/${topic.file}.json`);
                    const words = await response.json();
                    const section = document.createElement("div");
                    section.className = "topic-section";
                    section.innerHTML = `<div class="topic-title"><h2>${topic.name}</h2></div>`;
                    words.forEach(word => {
                        const card = document.createElement("div");
                        card.className = "word-card";
                        card.innerHTML = `
                            <div class="word">${word.word}</div>
                            <div class="definition">📖 ${word.correctMeaning}</div>
                            <div class="example">📝 مثال: ${word.example}</div>
                        `;
                        section.appendChild(card);
                    });
                    container.appendChild(section);
                } catch (err) {
                    console.error(`خطأ في تحميل ${topic.file}`, err);
                }
            }
        }
        loadDictionary();
    </script>
</body>
</html>
