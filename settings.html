<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - ITC Prep</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg">
</head>
<body>
  <div class="container">
    <h1>⚙️ إعدادات الأستاذ</h1>
    <div class="card">
      <h3>تغيير كلمة المرور</h3>
      <label>كلمة المرور الحالية:</label>
      <input type="password" id="currentPassword" class="form-control" placeholder="••••••">
      <label>كلمة المرور الجديدة:</label>
      <input type="password" id="newPassword" class="form-control" placeholder="••••••">
      <label>تأكيد الجديدة:</label>
      <input type="password" id="confirmPassword" class="form-control" placeholder="••••••">
      <button id="changePasswordBtn" class="btn btn-primary" style="margin-top:1rem;">حفظ التغيير</button>
      <p id="settingsMessage" style="margin-top:0.5rem;"></p>
    </div>
    <a href="index.html">العودة للرئيسية</a>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      enforcePassword();
      initApp();
    });

    document.getElementById('changePasswordBtn').addEventListener('click', async () => {
      const current = document.getElementById('currentPassword').value.trim();
      const newPass = document.getElementById('newPassword').value.trim();
      const confirm = document.getElementById('confirmPassword').value.trim();
      const msg = document.getElementById('settingsMessage');

      if (!current || !newPass || !confirm) {
        msg.textContent = 'املأ جميع الحقول';
        msg.style.color = 'var(--danger)';
        return;
      }
      if (newPass !== confirm) {
        msg.textContent = 'كلمتا المرور غير متطابقتين';
        msg.style.color = 'var(--danger)';
        return;
      }
      if (!(await isValidPassword(current))) {
        msg.textContent = 'كلمة المرور الحالية غير صحيحة';
        msg.style.color = 'var(--danger)';
        return;
      }

      const encoder = new TextEncoder();
      const data = encoder.encode(newPass);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const newHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      localStorage.setItem('passwordHash', newHash);
      msg.textContent = '✅ تم تغيير كلمة المرور بنجاح!';
      msg.style.color = 'green';
    });
  </script>
</body>
</html>
