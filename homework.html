<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Homework</title><link rel="stylesheet" href="css/style.css"><style>.container{max-width:600px;margin:auto;background:white;border-radius:28px;padding:1.5rem}.timer{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:1.5rem}.homework-section{margin-bottom:2.5rem}h2{border-bottom:2px solid #0071e3;padding-bottom:.5rem}.q-block{background:#f5f5f7;border-radius:16px;padding:1rem;margin-bottom:1.2rem}label{display:block;margin-bottom:.4rem;cursor:pointer}.btn{display:block;margin:1.5rem auto 0;background:#0071e3;color:white;border:none;border-radius:28px;padding:1rem 2.5rem;font-size:1.1rem;cursor:pointer}.result{text-align:center;font-size:1.3rem;font-weight:600;margin-top:1.2rem}</style></head><body><div class="container"><div class="timer" id="timer">⏳ 30:00</div><div id="content">جاري التحميل...</div><button class="btn" onclick="submitAll()">إنهاء الواجب</button><div class="result" id="result"></div></div><script>const p=new URLSearchParams(location.search);const day=p.get('day')||'1';const folder='day-'+day.toString().padStart(2,'0');let allQuestions=[],remaining=1800,interval;Promise.all([fetch('content/'+folder+'/reading.json').then(r=>r.json()),fetch('content/'+folder+'/vocabulary.json').then(r=>r.json()),fetch('content/'+folder+'/grammar-test.json').then(r=>r.json())]).then(([reading,vocab,grammar])=>{let h='';if(reading&&reading.passages){h+='<div class="homework-section"><h2>📖 أسئلة القراءة</h2>';reading.passages.forEach(p=>{if(p.questions)p.questions.forEach(q=>{allQuestions.push(q);h+='<div class="q-block"><p>'+(allQuestions.length)+'. '+q.q+'</p>';q.options.forEach((o,i)=>{h+='<label><input type="radio" name="q'+(allQuestions.length-1)+'" value="'+i+'"> '+o+'</label>'});h+='</div>'})});h+='</div>'}if(vocab&&vocab.questions){h+='<div class="homework-section"><h2>📝 أسئلة المفردات</h2>';vocab.questions.forEach(q=>{allQuestions.push(q);h+='<div class="q-block"><p>'+(allQuestions.length)+'. '+q.q+'</p>';q.options.forEach((o,i)=>{h+='<label><input type="radio" name="q'+(allQuestions.length-1)+'" value="'+i+'"> '+o+'</label>'});h+='</div>'});h+='</div>'}let grammarQs=Array.isArray(grammar)?grammar:grammar?.questions||[];if(grammarQs.length){h+='<div class="homework-section"><h2>📘 أسئلة القواعد</h2>';grammarQs.forEach(q=>{allQuestions.push(q);h+='<div class="q-block"><p>'+(allQuestions.length)+'. '+q.q+'</p>';q.options.forEach((o,i)=>{h+='<label><input type="radio" name="q'+(allQuestions.length-1)+'" value="'+i+'"> '+o+'</label>'});h+='</div>'});h+='</div>'}document.getElementById('content').innerHTML=h||'<p>لا يوجد واجب.</p>';startTimer()}).catch(()=>document.getElementById('content').innerHTML='<p>تعذر تحميل الواجب.</p>');function startTimer(){interval=setInterval(()=>{remaining--;let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent='⏳ '+m+':'+s.toString().padStart(2,'0');if(remaining<=0){clearInterval(interval);submitAll()}},1000)}function submitAll(){clearInterval(interval);let correct=0;allQuestions.forEach((q,i)=>{let sel=document.querySelector('input[name="q'+i+'"]:checked');let ans=q.answer!=null?q.answer:q.correct;if(sel&&parseInt(sel.value)===ans)correct++});let perc=Math.round(correct/allQuestions.length*100);let res=document.getElementById('result');res.textContent='النتيجة: '+correct+'/'+allQuestions.length+' ('+perc+'%)';res.style.color=perc>=50?'#34c759':'#ff3b30'}</script></body></html>
