<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam</title><link rel="stylesheet" href="css/style.css"><style>.container{max-width:600px;margin:auto;background:white;border-radius:28px;padding:1.5rem}.timer{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:1.5rem}.q-block{background:#f5f5f7;border-radius:16px;padding:1rem;margin-bottom:1.2rem}label{display:block;margin-bottom:.4rem;cursor:pointer}.btn{display:block;margin:1.5rem auto 0;background:#0071e3;color:white;border:none;border-radius:28px;padding:1rem 2.5rem;font-size:1.1rem;cursor:pointer}.result{text-align:center;font-size:1.3rem;font-weight:600;margin-top:1.2rem}</style></head><body><div class="container"><div class="timer" id="timer">⏳ 40:00</div><div id="content">جاري التحميل...</div><button class="btn" onclick="submitAll()">إنهاء</button><div class="result" id="result"></div></div><script>const p=new URLSearchParams(location.search);const file=p.get('file')||'itc-p05-10.json';let questions=[],remaining=2400,interval;fetch('content/exams/'+file).then(r=>r.json()).then(data=>{questions=Array.isArray(data)?data:data.questions||[];let h='';questions.forEach((q,i)=>{h+='<div class="q-block"><p>'+(i+1)+'. '+(q.q||q.question)+'</p>';(q.options||q.choices||[]).forEach((o,j)=>{h+='<label><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>'});h+='</div>'});document.getElementById('content').innerHTML=h;startTimer()}).catch(()=>document.getElementById('content').innerHTML='<p>تعذر التحميل.</p>');function startTimer(){interval=setInterval(()=>{remaining--;let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent='⏳ '+m+':'+s.toString().padStart(2,'0');if(remaining<=0){clearInterval(interval);submitAll()}},1000)}function submitAll(){clearInterval(interval);let correct=0;questions.forEach((q,i)=>{let sel=document.querySelector('input[name="q'+i+'"]:checked');let ans=q.answer!=null?q.answer:q.correct;if(sel&&parseInt(sel.value)===ans)correct++});let perc=Math.round(correct/questions.length*100);let res=document.getElementById('result');res.textContent='النتيجة: '+correct+'/'+questions.length+' ('+perc+'%)';res.style.color=perc>=50?'#34c759':'#ff3b30'}</script></body></html>
