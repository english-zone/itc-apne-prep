<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريب المفردات - 40 دقيقة</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .timer {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 20px;
            color: #d9534f;
        }
        .quiz-container {
            max-width: 800px;
            margin: auto;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
        }
        .vocab-question {
            font-size: 1.3rem;
        }
        .vocab-option-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }
        .vocab-option-btn:hover {
            background: #e0e0e0;
        }
        .feedback {
            margin: 15px 0;
        }
        .next-btn {
            background: #0077cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            text-align: center;
            font-size: 1.2rem;
        }
        .topic-title {
            text-align: center;
            color: #0077cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 تدريب المفردات</h1>
        <div class="timer">الوقت المتبقي: <span id="timer">40:00</span></div>
        <div class="quiz-container">
            <h2 id="topic-title" class="topic-title"></h2>
            <div id="quiz-area">
                <div id="question-text" class="vocab-question"></div>
                <div id="options-area"></div>
                <div id="feedback" class="feedback"></div>
                <button id="next-btn" class="next-btn" style="display:none;">التالي ➡️</button>
            </div>
            <div id="result-area" style="display:none;"></div>
        </div>
    </div>
    <script>
        // الحصول على parameter topic من URL
        const urlParams = new URLSearchParams(window.location.search);
        let topic = urlParams.get('topic');
        if (!topic) topic = 'family-body';
        document.getElementById("topic-title").innerText = "الموضوع: " + topic.replace(/-/g, ' ').toUpperCase();

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let timerInterval;
        let timeSeconds = 40 * 60; // 40 دقيقة

        // تحميل الأسئلة من ملف JSON المناسب
        async function loadQuestions() {
            try {
                const response = await fetch(`content/vocabulary/topics/${topic}.json`);
                if (!response.ok) {
                    if (topic === 'review') {
                        // للمراجعة: نجمع كل المواضيع (اختياري)
                        document.getElementById("quiz-area").innerHTML = "<p>سيتم توفير مراجعة شاملة قريباً.</p>";
                        return;
                    }
                    throw new Error("File not found");
                }
                const words = await response.json();
                questions = words.map(item => ({
                    word: item.word,
                    correct: item.correctMeaning,
                    options: shuffleArray([item.correctMeaning, ...item.distractors]),
                    example: item.example
                }));
                startTimer();
                showQuestion();
            } catch (err) {
                document.getElementById("quiz-area").innerHTML = `<p style="color:red;">❌ لم يتم العثور على مفردات للموضوع ${topic}. تأكد من وجود الملف.</p>`;
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeSeconds <= 0) {
                    clearInterval(timerInterval);
                    endPractice("⏰ انتهى الوقت!");
                    return;
                }
                timeSeconds--;
                const minutes = Math.floor(timeSeconds / 60);
                const seconds = timeSeconds % 60;
                document.getElementById("timer").innerText = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                endPractice(`🎉 انتهيت! إجاباتك الصحيحة: ${score} من ${questions.length}`);
                return;
            }
            const q = questions[currentIndex];
            document.getElementById("question-text").innerHTML = `<strong>ما معنى كلمة: <span style="color:#0077cc;">${q.word}</span>؟</strong><br><div class="vocab-example">📖 مثال: ${q.example}</div>`;
            const optionsDiv = document.getElementById("options-area");
            optionsDiv.innerHTML = "";
            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerText = opt;
                btn.className = "vocab-option-btn";
                btn.onclick = () => checkAnswer(opt);
                optionsDiv.appendChild(btn);
            });
            document.getElementById("feedback").innerHTML = "";
            document.getElementById("next-btn").style.display = "none";
        }

        function checkAnswer(selected) {
            const q = questions[currentIndex];
            const isCorrect = (selected === q.correct);
            if (isCorrect) {
                score++;
                document.getElementById("feedback").innerHTML = `<span style="color:green;">✅ صحيح! معنى "${q.word}" هو "${q.correct}".</span>`;
            } else {
                document.getElementById("feedback").innerHTML = `<span style="color:red;">❌ خطأ. المعنى الصحيح هو: "${q.correct}".</span>`;
            }
            document.getElementById("next-btn").style.display = "inline-block";
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function endPractice(message) {
            clearInterval(timerInterval);
            document.getElementById("quiz-area").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            document.getElementById("result-area").innerHTML = `<div class="result">${message}<br><br><button onclick="location.reload()">🔄 محاولة جديدة</button> <button onclick="location.href='schedule.html'">📅 العودة للجدول</button></div>`;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.getElementById("next-btn").onclick = nextQuestion;
        loadQuestions();
    </script>
</body>
</html>
