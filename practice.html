<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vocabulary Quiz</title><link rel="stylesheet" href="css/style.css"><style>.container{max-width:600px;margin:auto;background:white;border-radius:28px;padding:1.5rem}.q-card{background:#f5f5f7;border-radius:16px;padding:1.2rem;margin-bottom:1.5rem}.q-text{font-weight:600;margin-bottom:.8rem}.page-badge{font-size:.7rem;color:#aaa;margin-right:.5rem;font-style:italic}.options-list{list-style:none;padding:0}.options-list li{padding:.4rem 0;border-bottom:1px solid #e9e9ef;cursor:pointer}.options-list li:hover{background:#eef}.feedback{margin-top:.8rem;padding:.8rem;border-radius:10px;display:none;font-size:.9rem}.feedback.correct{background:#e8f5e9;color:#2e7d32;border-right:4px solid #2e7d32;display:block}.feedback.wrong{background:#fbe9e7;color:#c62828;border-right:4px solid #c62828;display:block}.btn-print{background:#ff9500;color:white;border:none;border-radius:20px;padding:0.5rem 1.2rem;cursor:pointer;margin-bottom:1rem;display:inline-block;font-size:0.9rem}</style></head><body><div class="container"><h2>🧠 مفردات اليوم</h2><button class="btn-print" onclick="window.open('print.html?day='+new URLSearchParams(location.search).get('day')+'&type=vocabulary','_blank')">🖨️ طباعة</button><div id="vocabContent">جاري التحميل...</div></div><script>
const params = new URLSearchParams(location.search);
const day = params.get('day') || '1';
const folder = 'day-' + day.toString().padStart(2, '0');
let wordsData = [];
fetch('content/' + folder + '/vocabulary.json').then(r=>r.json()).then(data=>{
wordsData = data.words || [];
if(!wordsData.length){ document.getElementById('vocabContent').innerHTML='<p>لا توجد مفردات.</p>'; return; }
let html = ''; wordsData.forEach((w,i)=>{
if(w.question && w.question.q){
html += `<div class="q-card" id="card${i}"><div class="q-text">${i+1}. ${w.question.q} <span class="page-badge">(صفحة ${w.page})</span></div><ul class="options-list">`;
let opts = [...w.question.options];
let correctAns = w.question.answer != null ? w.question.answer : w.question.correct;
let correctText = opts[correctAns];
opts.sort(()=>Math.random()-0.5);
let newCorrectIndex = opts.indexOf(correctText);
if(newCorrectIndex === -1) newCorrectIndex = correctAns;
w._shuffledOptions = opts;
w._shuffledAnswer = newCorrectIndex;
opts.forEach((opt,oi)=>{ html += `<li onclick="checkAnswer(${i}, ${oi})">${opt}</li>`; });
html += `</ul><div class="feedback" id="fb${i}"></div></div>`;
}
});
document.getElementById('vocabContent').innerHTML = html || '<p>لا توجد أسئلة مفردات.</p>';
}).catch(()=> document.getElementById('vocabContent').innerHTML = '<p>تعذر التحميل.</p>');

function checkAnswer(idx, selected){
const w = wordsData[idx];
if(!w || !w.question) return;
const correct = w._shuffledAnswer != null ? w._shuffledAnswer : (w.question.answer != null ? w.question.answer : w.question.correct);
const fb = document.getElementById('fb'+idx);
const isCorrect = (selected === correct);
const correctWord = w._shuffledOptions[correct];
fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
let justification = w.question.justification || '';
let html = (isCorrect ? '✅ صحيح! ' : '❌ خطأ. ') + `الكلمة: <b>${w.english}</b> – ${w.arabic} (صفحة ${w.page})`;
if(justification) html += `<br><br>📖 ${justification}`;
fb.innerHTML = html;
const card = document.getElementById('card'+idx);
if(card) card.querySelectorAll('li').forEach(li => li.style.pointerEvents = 'none');
}
</script></body></html>
