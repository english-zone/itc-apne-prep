<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vocabulary</title><link rel="stylesheet" href="css/style.css"><style>.container{max-width:560px;margin:auto;background:white;border-radius:28px;padding:1.5rem}.word-card{background:#f5f5f7;border-radius:18px;padding:1.2rem;margin-bottom:1.2rem}.word-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.word-en{font-size:1.4rem;font-weight:700;color:#1d1d1f}.word-ar{font-size:1.1rem;color:#0071e3;font-weight:600}.word-page{font-size:.8rem;color:#86868b}.quiz-section{margin-top:.8rem}.quiz-section p{font-weight:600;color:#333;margin-bottom:.4rem}label{display:block;margin-bottom:.3rem;cursor:pointer}.feedback{font-size:.85rem;margin-top:.3rem}</style></head><body><div class="container"><h2>🧠 مفردات اليوم</h2><div id="vocabContent">جاري التحميل...</div></div><script>const p=new URLSearchParams(location.search);const day=p.get('day')||'1';const folder='day-'+day.toString().padStart(2,'0');let wordsData=[];fetch('content/'+folder+'/vocabulary.json').then(r=>r.json()).then(data=>{wordsData=data.words||[];if(!wordsData.length){document.getElementById('vocabContent').innerHTML='<p>لا توجد مفردات.</p>';return}let h='';wordsData.forEach((w,i)=>{h+='<div class="word-card"><div class="word-header"><span class="word-en">'+w.english+'</span><span class="word-ar">'+w.arabic+'</span><span class="word-page">ص '+w.page+'</span></div>';if(w.question&&w.question.q){h+='<div class="quiz-section"><p>📝 '+w.question.q+'</p>';w.question.options.forEach((o,oi)=>{h+='<label><input type="radio" name="q'+i+'" value="'+oi+'" onchange="checkAnswer('+i+','+oi+')"> '+o+'</label>'});h+='<div class="feedback" id="fb'+i+'"></div></div>'}h+='</div>'});document.getElementById('vocabContent').innerHTML=h}).catch(()=>document.getElementById('vocabContent').innerHTML='<p>تعذر التحميل.</p>');function checkAnswer(idx,selected){let w=wordsData[idx];if(!w||!w.question)return;let correct=w.question.answer!=null?w.question.answer:w.question.correct;let fb=document.getElementById('fb'+idx);if(selected===correct){fb.textContent='✅ صحيح!';fb.style.color='#34c759'}else{let txt=(w.question.options||[])[correct]||'';fb.textContent='❌ خطأ. الصحيح: '+txt;fb.style.color='#ff3b30'}}</script></body></html>
