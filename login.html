<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول للتجميعات</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-box { max-width:400px; margin: 5rem auto; background: white; border-radius: 24px; padding: 2rem; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.06); }
        .login-box h2 { margin-bottom: 1.5rem; }
        .login-box input { width: 100%; padding: 0.8rem; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 1rem; margin-bottom: 1rem; text-align: center; }
        .login-box button { background: #0071e3; color: white; border: none; padding: 0.8rem 2rem; border-radius: 28px; font-size: 1rem; cursor: pointer; }
        .error { color: #ff3b30; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 تجميعات الطلاب</h2>
        <p style="color:#86868b;margin-bottom:1rem;">أدخل كلمة المرور للوصول إلى التجميعات</p>
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="checkPassword()">دخول</button>
        <div class="error" id="error"></div>
    </div>
    <script>
        const correctPassword = "reyadah2025";
        function checkPassword() {
            const pw = document.getElementById("password").value;
            if (pw === correctPassword) {
                window.location.href = "collections.html";
            } else {
                document.getElementById("error").textContent = "❌ كلمة مرور خاطئة";
            }
        }
    </script>
</body>
</html>
