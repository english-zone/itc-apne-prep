<!DOCTYPE html><html lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dictation</title><link rel="stylesheet" href="css/style.css"><style>.container{max-width:540px;margin:auto;background:white;border-radius:28px;padding:1.5rem}.word-card{background:#f5f5f7;border-radius:18px;padding:1.2rem;margin-bottom:1.2rem}.prompt{font-size:1.3rem;font-weight:700;color:#1d1d1f;margin-bottom:.8rem;text-align:center}.options{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}.option-btn{background:white;border:1px solid #d2d2d7;border-radius:20px;padding:.6rem 1.4rem;cursor:pointer;font-size:1rem;transition:.2s}.correct{background:#34c759;color:white;border-color:#34c759}.wrong{background:#ff3b30;color:white;border-color:#ff3b30}.feedback{text-align:center;margin-top:.5rem;font-weight:600}.result{text-align:center;font-size:1.3rem;margin-top:1.5rem;font-weight:700}.btn{display:block;margin:2rem auto 0;background:#0071e3;color:white;border:none;border-radius:28px;padding:1rem 2.5rem;font-size:1.1rem;cursor:pointer}</style></head><body><div class="container"><h2>✍️ Choose the Correct Spelling</h2><div id="dictationContent">جاري التحميل...</div><button class="btn" onclick="submitAll()">إنهاء الإملاء</button><div class="result" id="result"></div></div><script>const p=new URLSearchParams(location.search);const day=p.get('day')||'1';const folder='day-'+day.toString().padStart(2,'0');let words=[],correctCount=0;fetch('content/'+folder+'/dictation.json').then(r=>r.json()).then(data=>{words=data.words||[];if(!words.length){document.getElementById('dictationContent').innerHTML='<p>لا توجد كلمات.</p>';return}let h='';words.forEach((item,idx)=>{h+='<div class="word-card"><div class="prompt">🔊 Choose the correct spelling</div><div class="options" id="opts'+idx+'">'+item.options.map(opt=>'<span class="option-btn" data-idx="'+idx+'" data-word="'+opt+'" data-correct="'+item.correct+'">'+opt+'</span>').join('')+'</div><div class="feedback" id="fb'+idx+'"></div></div>'});document.getElementById('dictationContent').innerHTML=h;document.querySelectorAll('.option-btn').forEach(btn=>{btn.addEventListener('click',function(){let idx=this.dataset.idx;if(this.parentElement.dataset.answered==='true')return;this.parentElement.dataset.answered='true';let isCorrect=this.dataset.word===this.dataset.correct;this.parentElement.querySelectorAll('.option-btn').forEach(b=>{if(b.dataset.word===b.dataset.correct)b.classList.add('correct');else b.classList.add('wrong')});if(isCorrect){correctCount++;document.getElementById('fb'+idx).textContent='✅ صحيح';document.getElementById('fb'+idx).style.color='#34c759'}else{document.getElementById('fb'+idx).textContent='❌ خطأ';document.getElementById('fb'+idx).style.color='#ff3b30'}})})}).catch(()=>document.getElementById('dictationContent').innerHTML='<p>تعذر التحميل.</p>');function submitAll(){document.getElementById('result').textContent='النتيجة: '+correctCount+' / '+words.length}</script></body></html>
<button class="btn" onclick="window.open('print.html?day=' + new URLSearchParams(location.search).get('day') + '&type=dictation', '_blank')" style="background:#ff9500;margin-bottom:1rem;display:inline-block;">🖨️ طباعة</button>
