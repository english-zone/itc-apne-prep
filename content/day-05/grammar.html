<h2>Comparative & Superlative</h2>
<h3>Comparative (er / more + than)</h3>
<p>My sister is <b>younger</b> than me. / English is <b>more interesting</b> than math.</p>
<h3>Superlative (the + est / most)</h3>
<p>She is <b>the youngest</b>. / That was <b>the most difficult</b> test.</p>
<h3>شواذ:</h3>
<p>good → better → best | bad → worse → worst | far → farther → farthest</p>
