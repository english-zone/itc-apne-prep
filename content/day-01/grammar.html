<h2>Present Simple & Past Simple</h2>
<h3>Present Simple</h3>
<p><strong>الاستخدام:</strong> حقائق، عادات، جداول.<br><strong>أمثلة:</strong> The Earth rotates. He gets up at 8. Do you speak English?</p>
<h3>Past Simple</h3>
<p><strong>الاستخدام:</strong> أحداث مكتملة في الماضي.<br><strong>أمثلة:</strong> I went to the mall. Did they visit? I didn't hear you.</p>
