<h2>Gerund vs Infinitive</h2>
<h3>Gerund (v+ing)</h3>
<p>بعد: enjoy, mind, stop, suggest, avoid...<br><strong>مثال:</strong> She <b>enjoys running</b>.</p>
<h3>Infinitive (to + v)</h3>
<p>بعد: decide, want, promise, agree...<br><strong>مثال:</strong> They decided <b>to go</b>.</p>
<h3>فرق بالمعنى:</h3>
<p>stop smoking (توقف عن التدخين) / stop to smoke (توقف ليدخن)</p>
