<h2>Passive Voice</h2>
<p><strong>be + past participle</strong></p>
<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
<tr><th>Active</th><th>Passive</th></tr>
<tr><td>They make cars.</td><td>Cars <b>are made</b>.</td></tr>
<tr><td>My father wrote this book.</td><td>This book <b>was written</b> by my father.</td></tr>
<tr><td>I will do the exercise.</td><td>The exercise <b>will be done</b> by me.</td></tr>
</table>
