<h2>Past Simple & Articles</h2>
<h3>Past Simple</h3>
<p><strong>الاستخدام:</strong> أحداث مكتملة في الماضي.<br><strong>أمثلة:</strong> I <b>saw</b> a deer an hour ago. <b>Did</b> you <b>visit</b> your grandmother?</p>
<h3>Articles (a / an / the)</h3>
<p><strong>a / an:</strong> شيء غير محدد. (<b>a</b> book, <b>an</b> apple)<br><strong>the:</strong> شيء معروف أو مذكور سابقاً.</p>
