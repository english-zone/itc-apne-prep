<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link rel="icon" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading – ITC APNE Prep</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <nav class="navbar" id="navbar"></nav>
    <div class="theme-toggle"><button id="themeToggle" aria-label="Toggle dark/light mode">🌓</button></div>
  </header>
  <main class="container">
    <section class="reading-header">
      <h1>📖 Reading Practice</h1>
      <div class="reading-controls">
        <select id="passageSelector" class="form-select"><option value="">-- Load a passage --</option></select>
        <button id="focusModeBtn" class="btn btn-outline">🧘 Focus Mode</button>
        <span id="readingTimer" class="timer">00:00</span>
      </div>
    </section>
    <section id="readingContent" class="reading-area">
      <div class="empty-state"><p>Select a passage or add JSON files to /content/reading/</p></div>
    </section>
    <section id="comprehensionSection" class="comprehension" style="display:none;">
      <h2>Comprehension Check</h2>
      <div id="questionsContainer"></div>
      <button id="submitAnswers" class="btn btn-primary">Submit Answers</button>
      <div id="resultsContainer" class="results"></div>
    </section>
    <div id="wordPopup" class="popup-overlay" style="display:none;">
      <div class="popup-card">
        <button class="popup-close">&times;</button>
        <div id="popupContent"></div>
      </div>
    </div>
  </main>
  <footer class="app-footer"><p>Reading Engine – words link to dictionary.json</p></footer>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
