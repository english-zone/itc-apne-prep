<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITC APNE Prep - Vocabulary by Topic</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .topic-selector { margin-bottom: 20px; text-align: center; }
        .topic-selector select { padding: 8px; font-size: 1rem; border-radius: 6px; }
        .vocab-question { font-size: 1.3rem; }
        .vocab-option-btn { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
        .correct-feedback { color: green; }
        .wrong-feedback { color: red; }
        #next-vocab-btn { background: #0077cc; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 تدريب المفردات حسب الموضوع</h1>
        <div class="topic-selector">
            <label>اختر الموضوع: </label>
            <select id="topic-select" onchange="changeTopic()">
                <option value="family-body">Family & Body Parts</option>
                <option value="clothing-weather">Clothing & Weather</option>
                <option value="health-medicine">Health & Medicine</option>
                <option value="food-drink">Food & Drink</option>
                <option value="jobs-work">Jobs & Work</option>
                <option value="shopping-materials">Shopping & Materials</option>
            </select>
        </div>
        <div id="quiz-area">
            <div id="question-text" class="vocab-question"></div>
            <div id="options-area"></div>
            <div id="feedback"></div>
            <button id="next-vocab-btn" style="display:none;" onclick="nextQuestion()">التالي →</button>
        </div>
    </div>
    <script src="js/topic-vocab.js"></script>
</body>
</html>
