<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APNE Prep | مركز الريادة للتدريب</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: #f5f5f7; padding: 1rem; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
        .app-container { max-width: 500px; margin: 0 auto; }
        .header-card {
            background: white; border-radius: 28px; padding: 1.5rem;
            text-align: center; margin-bottom: 1.5rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
        }
        .header-card img { height: 45px; margin-bottom: 0.5rem; }
        .header-card h1 { font-size: 1.6rem; font-weight: 700; color: #1d1d1f; margin: 0; }
        .header-card .subtitle { font-size: 0.95rem; color: #86868b; margin-top: 0.25rem; }
        .day-card {
            background: white; border-radius: 24px; padding: 1.2rem; margin-bottom: 1.2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .day-title { font-weight: 700; font-size: 1.2rem; color: #1d1d1f; margin-bottom: 0.8rem; }
        .row-item { display: flex; align-items: center; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid #f0f0f5; }
        .row-item:last-child { border-bottom: none; }
        .label { font-weight: 500; color: #1d1d1f; font-size: 0.95rem; }
        .desc { font-size: 0.8rem; color: #86868b; }
        .btn, a {
            background: #0071e3; color: white; font-weight: 500; font-size: 14px;
            padding: 8px 16px; border-radius: 20px; text-decoration: none;
            display: inline-block; transition: 0.2s; white-space: nowrap;
        }
        .btn.secondary, a.secondary { background: #e9e9ef; color: #1d1d1f; }
        .final-review {
            background: white; border-radius: 24px; padding: 1.2rem; margin-top: 1rem;
            text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .final-review h2 { font-size: 1.2rem; margin-bottom: 0.8rem; }
        .final-review .btn, .final-review a { margin: 5px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-card">
            <img src="assets/images/reyadah-logo.png" alt="شعار مركز الريادة" onerror="this.style.display='none'">
            <h1>APNE-ITC</h1>
            <div class="subtitle">مركز الريادة للتدريب</div>
        </div>

        <div id="daysContainer"></div>

        <div class="final-review">
            <a href="login.html" style="background:#ff9500;color:white;">🔐 تجميعات</a>
<a href="login.html" style="background:#ff9500;color:white;">🔐 تجميعات</a>
<a href="grammar.html" class="secondary">📘 جميع القواعد</a>
            <h2>📋 المراجعة النهائية</h2>
            <a href="dictionary.html" class="secondary">📚 المفردات</a>
            <a href="grammar.html" class="secondary">📘 القواعد</a>
            <a href="mistakes.html" style="background:#ff9500;">⚡ الطوارئ</a>
            <a href="exam.html">🧪 اختبار شامل</a>
        </div>
    </div>

    <script>
        const days = [1, 2, 3, 4, 5, 6, 7];
        const map = {
            1: {r:"Letter + Farming + VSO", v:"Family & Body", g:"Present Simple + Pronouns"},
            2: {r:"Bicycles + Red Sea + Diabetes", v:"Clothing & Weather", g:"Past Simple + Articles"},
            3: {r:"Amelia + Super Bus + Email", v:"Health & Medicine", g:"Perfect Tenses"},
            4: {r:"Japan + USA Gov + Water", v:"Food & Drink", g:"Passive Voice"},
            5: {r:"California + Egypt", v:"Jobs & Work", g:"Comparative/Superlative"},
            6: {r:"All Blacks + Tambora", v:"Shopping & Materials", g:"Gerund/Infinitive"},
            7: {r:"Mock Exam", v:"Review All", g:"Final Review"}
        };
        let html = '';
        days.forEach(day => {
            let m = map[day];
            html += `<div class="day-card">
                <div class="day-title">🗓️ اليوم ${day}</div>
                <div class="row-item">
                    <span class="label">📖 قراءة</span>
                    <span class="desc">${m.r}</span>
                    <a href="reading.html?day=${day}" class="secondary">بدء</a>
                </div>
                <div class="row-item">
                    <span class="label">🧠 مفردات</span>
                    <span class="desc">${m.v}</span>
                    <a href="practice.html?day=${day}" class="secondary">دراسة</a>
                </div>
                <div class="row-item">
                    <span class="label">📘 قواعد</span>
                    <span class="desc">${m.g}</span>
                    <a href="grammar-lesson.html?day=${day}" class="secondary">فتح</a>
                </div>
                <div class="row-item">
                    <span class="label">✍️ إملاء</span>
                    <span class="desc">اختر التهجئة الصحيحة</span>
                    <a href="dictation.html?day=${day}" class="secondary">بدء</a>
                </div>
                <div class="row-item">
                    <span class="label">📝 واجب</span>
                    <span class="desc">واجب اليوم الشامل</span>
                    <a href="homework.html?day=${day}" style="background:#ff9500;">فتح</a>
                </div>
                <div class="row-item">
                    <span class="label">✅ اختبار</span>
                    <span class="desc">اختبار زمني</span>
                    <a href="grammar-test.html?day=${day}">بدء</a>
                </div>
                <div class="row-item">
                    <span class="label">⚠️ أخطاء</span>
                    <span class="desc">مراجعة الأخطاء</span>
                    <a href="mistakes.html" style="background:#ff3b30;">مراجعة</a>
                </div>
            </div>`;
        });
        document.getElementById('daysContainer').innerHTML = html;
    </script>
</body>
</html>
