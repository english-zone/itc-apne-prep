<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التجميعات المحمية</title>
<link rel="stylesheet" href="css/style.css">
<style>
.coll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; margin: 1.5rem 0; }
.coll-card { background: white; border-radius: 20px; padding: 1.3rem; box-shadow: 0 2px 12px rgba(0,0,0,0.04); text-align: center; }
.coll-card h3 { margin-top: 0; color: #1d1d1f; }
.coll-card p { margin-bottom: 1rem; }
.coll-card a { background: #0071e3; color: white; padding: 0.5rem 1.2rem; border-radius: 20px; text-decoration: none; display: inline-block; }
</style>
</head>
<body>
<div class="container">
  <h1>🔐 تجميعات المحاكاة</h1>
  <p style="color:#86868b;">اختر التجميع الذي تريد التدرب عليه.</p>
  <div class="coll-grid" id="grid"></div>
</div>
<script>
const base = 'content/exams/compilation-review.html?file=compilation-';
let html = '';
for (let i = 1; i <= 6; i++) {
    html += `<div class="coll-card">
        <h3>${i} تجمع</h3>
        <p>اختبار محاكي ${i} + قطعتين</p>
        <a href="${base}${i}.json">فتح</a>
    </div>`;
}
document.getElementById('grid').innerHTML = html;
</script>
</body>
</html>
